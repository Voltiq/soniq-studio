[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Soniq Studio contributors"]

[workspace.dependencies]
soniq-project = { path = "crates/soniq-project" }
soniq-io = { path = "crates/soniq-io" }
soniq-engine = { path = "crates/soniq-engine" }
soniq-dsp = { path = "crates/soniq-dsp" }
soniq-midi = { path = "crates/soniq-midi" }
soniq-host = { path = "crates/soniq-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.16"
rtrb = "0.3"
hound = "3.5"
flacenc = "0.4"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
rustfft = "6.4"
# LAME is LGPL: fine for personal use and open-source releases; a closed-source
# release must ship it as a replaceable library instead (ROADMAP §9).
mp3lame-encoder = "0.2.5"
vorbis_rs = "0.5.6"
# libopus transpiled to Rust: no C toolchain or CMake needed.
unsafe-libopus = "0.2.0"
ogg = "0.9.2"
id3 = "1.17"

# Audio code is unusable unoptimised: keep the engine, I/O and all
# dependencies fast in dev builds while the app crate stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.soniq-engine]
opt-level = 2

[profile.dev.package.soniq-io]
opt-level = 2

[profile.dev.package.soniq-dsp]
opt-level = 2

[profile.dev.package.soniq-host]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
