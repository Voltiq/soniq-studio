[package]
name = "soniq-host"
description = "Soniq Studio plugin hosting: CLAP plugins in a sandbox process, driven over shared memory"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
soniq-dsp.workspace = true
serde.workspace = true
serde_json.workspace = true
clap-sys = "0.5"
libloading = "0.8"
vst3 = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# Two small CLAP plugins the tests load through the sandbox.
[[example]]
name = "test_plugins"
crate-type = ["cdylib"]

# Two small VST3 plugins the tests load through the sandbox.
[[example]]
name = "test_vst3"
crate-type = ["cdylib"]
